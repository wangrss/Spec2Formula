name: CPU inference regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reference CPU dependencies and package
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 setuptools wheel
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Verify checkpoint assets
        run: spec2formula verify --model-dir checkpoints/default
      - name: Build native enumerator
        run: python tools/build_enumerator.py
      - name: Run input, concurrency and numerical regression tests
        run: python -m unittest discover -s tests -v
